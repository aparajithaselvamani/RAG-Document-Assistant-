[pytest]
# Exclude training directory from normal test discovery
# Training tests require fine-tuning dependencies (peft, transformers, etc)
# Run with: pytest training/ --ignore-import-errors
# Or install requirements-training.txt first

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Don't fail if training modules can't be imported
addopts = --ignore=training
